services:
  whiskeyapp:
    build: .
    image: whiskeyapp:latest
    # This image is only ever built locally from the Dockerfile above, never
    # pulled from a registry — tells `docker compose pull` (which Komodo and
    # other deploy tools run as a separate step) to skip this service instead
    # of trying to fetch "whiskeyapp" from Docker Hub and failing.
    pull_policy: build
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - whiskey-data:/data
      # Uncomment once you've generated certs/key.pem + certs/cert.pem (see
      # README's HTTPS section) to serve over HTTPS.
      # - ./certs:/certs:ro
    # environment:
    #   TLS_KEY_PATH: /certs/key.pem
    #   TLS_CERT_PATH: /certs/cert.pem

volumes:
  whiskey-data:
