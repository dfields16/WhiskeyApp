services:
  whiskeyapp:
    build: .
    image: whiskeyapp:latest
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - whiskey-data:/data
      # Uncomment once you've generated certs/key.pem + certs/cert.pem (see
      # README's HTTPS section) to serve over HTTPS.
      # - ./certs:/certs:ro
    # environment:
    #   TLS_KEY_PATH: /certs/key.pem
    #   TLS_CERT_PATH: /certs/cert.pem

volumes:
  whiskey-data:
